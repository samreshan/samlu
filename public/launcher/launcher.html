<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Samlu Launcher</title>
    <link rel="stylesheet" href="../presence.css" />
    <link rel="stylesheet" href="./launcher.css?v=6" />
  </head>
  <body>
    <!-- The window is fixed-size and transparent; the panel inside it grows
         and shrinks with its results. A click outside the panel dismisses. -->
    <div id="stage" class="stage">
      <div id="panel" class="panel" data-state="closed" data-motion="surface">
        <div class="search">
          <span class="search-mark" aria-hidden="true">
            <svg viewBox="0 0 240 240">
              <g class="samlu-mark-brand">
                <rect x="48" y="96" width="96" height="96" />
                <rect x="143.5" y=".5" width="96" height="96" />
                <rect y="192.5" width="48.5" height="47.5" />
              </g>
              <g class="samlu-mark-ink">
                <path d="M144,0h0v96H48C48,43.02,91.02,0,144,0Z" />
                <path d="M143,96h96c0,52.98-43.02,96-96,96h0v-96h0Z" />
              </g>
            </svg>
          </span>
          <!-- The project the action panel and the task view are about. -->
          <span id="scope" class="scope" hidden></span>
          <input
            id="query"
            class="query"
            type="text"
            placeholder="Search apps, projects, and files"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            role="combobox"
            aria-autocomplete="list"
            aria-controls="results"
            aria-expanded="true"
          />
          <span class="hotkey" id="hotkey" aria-hidden="true"></span>
        </div>
        <p id="notice" class="notice" role="status"></p>
        <div class="body" id="body">
          <ul id="results" class="results" role="listbox" aria-label="Results"></ul>
          <section id="task" class="task" aria-label="Task" hidden>
            <div class="task-head">
              <span id="task-status" class="task-status" aria-live="polite"></span>
              <span id="task-meta" class="task-meta"></span>
            </div>
            <div id="task-links" class="task-links" aria-label="Links" hidden></div>
            <div id="task-log" class="task-log" role="log" aria-label="Output" aria-live="off"></div>
          </section>
        </div>
        <footer class="bar">
          <span class="legend" id="legend" aria-label="Search prefixes">
            <span><kbd>=</kbd>Calculate</span>
            <span><kbd>;</kbd>Snippets</span>
            <span><kbd>@</kbd>Clipboard</span>
            <span><kbd>&gt;</kbd>Commands</span>
            <span id="legend-describe" hidden><kbd>?</kbd>Describe</span>
            <span><kbd>!</kbd>Tasks</span>
          </span>
          <span class="action" id="action" aria-live="polite"></span>
        </footer>
      </div>
    </div>
    <script src="../platform.js"></script>
    <script src="./launcher.js?v=5"></script>
  </body>
</html>
