<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samlu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./pet.css?v=1" />
  </head>
  <body>
    <main id="shell" class="shell" data-phase="idle" data-collapsed="false">
      <!-- Thought bubble = the mascot "thinking" about your agents. -->
      <section id="bubble" class="bubble">
        <header class="bubble-head">
          <span id="dot" class="dot" aria-hidden="true"></span>
          <span id="label" class="label">Watching</span>
          <button type="button" id="collapse" class="collapse" aria-label="Collapse">
            <span class="chev" aria-hidden="true"></span>
          </button>
        </header>
        <p id="task" class="task">No agent activity yet</p>
        <p id="timer" class="timer detail-line" aria-live="polite"></p>
      </section>

      <!-- Thought trail (shrinking dots) linking the bubble to the mascot's head. -->
      <div id="trail" class="trail" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>

      <!-- Animated mascot sprite. Click to open Samlu's settings window. -->
      <div id="mascot" class="mascot" aria-hidden="true"></div>

      <!-- Reopen handle, shown only while collapsed. -->
      <button type="button" id="reopen" class="reopen" aria-label="Show status">
        <span class="chev down" aria-hidden="true"></span>
      </button>
    </main>
    <script src="./pet.js?v=1"></script>
  </body>
</html>
