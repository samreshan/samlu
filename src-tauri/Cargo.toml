[package]
name = "samlu"
version = "0.1.0"
description = "Samlu – a desktop companion that reacts when your AI coding agents finish or need you"
authors = ["Samlu contributors"]
license = "Apache-2.0"
repository = "https://github.com/samreshan/samlu"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "5"
