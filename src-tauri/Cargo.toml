[package]
name = "samlu"
version = "0.5.0"
description = "Samlu - an AI development kit for macOS and Windows: voice, agent notifications, and developer commands"
authors = ["Samlu contributors"]
license = "Apache-2.0"
repository = "https://github.com/samreshan/samlu"
edition = "2021"
rust-version = "1.88"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tiny_http = "0.12"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "5"
base64 = "0.22"
plist = "1"
cpal = "0.15"
hound = "3.5"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
toml_edit = "0.22"
sha2 = "0.10"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
semver = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
model2vec-rs = { version = "0.3", default-features = false }
# model2vec's own fancy-regex feature also turns on tokenizers' C++ esaxx
# backend, which is built against the static C runtime; MSVC refuses to link
# it beside whisper.cpp's dynamic one. Only tokenizer training uses esaxx, so
# ask tokenizers for the regex engine directly.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
notify = "8"
walkdir = "2"
pdf-extract = "0.12"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Whisper runs on Metal on macOS and on the CPU everywhere else.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal", "log_backend"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["log_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
